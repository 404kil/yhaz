<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YAHWZ.IT</title>
<meta name="description" content="Digitalizziamo la tua impresa. Archivio, soluzioni, laboratorio, partnership.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root{
  --bg-dark:#000; --fg-dark:#fff; --muted-dark:#9a9a9a;
  --bg-light:#fff; --fg-light:#000; --muted-light:#555;
  --primary:#fff;
}
*{margin:0; padding:0; box-sizing:border-box;}
html, body{font-family:'Space Mono', monospace; height:100%; scroll-behavior:smooth;}
body{display:flex; flex-direction:column; min-height:100vh; background:var(--bg-dark); color:var(--fg-dark);}
@media(prefers-color-scheme: light){
  body{background:var(--bg-light); color:var(--fg-light);}
}

header, footer{padding:20px; text-align:center; border-bottom:1px solid #111;}
footer{border-top:1px solid #111; border-bottom:none; font-size:12px; color:var(--muted-dark);}
@media(prefers-color-scheme: light){ footer{color:var(--muted-light); border-color:#ccc;} }

.hero{
  flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
  text-align:center; padding:60px 20px; gap:20px;
}
.hero h1{font-size:clamp(28px,6vw,72px); line-height:1.1; font-weight:700; text-transform:uppercase; letter-spacing:-1px;}
.hero p{font-size:16px; color:var(--muted-dark); max-width:600px;}
@media(prefers-color-scheme: light){ .hero p{color:var(--muted-light);} }

.links{display:flex; flex-direction:column; gap:16px; margin-top:32px; width:100%; max-width:360px;}
.link{
  padding:16px; border:1px solid #222; background:transparent; color:inherit;
  text-transform:uppercase; font-size:14px; text-align:center; transition:all .2s; border-radius:6px;
}
.link:hover{background:#111; color:#fff; transform:translateY(-2px);}
@media(prefers-color-scheme: light){ .link{border-color:#ccc;} .link:hover{background:#ddd;color:#000;} }

.footer-contact{margin-top:12px; display:flex; justify-content:center; gap:20px; flex-wrap:wrap; align-items:center;}
.footer-contact a{color:inherit; font-size:14px; text-decoration:none; transition:0.2s; display:flex; align-items:center; gap:6px;}
.footer-contact a:hover{opacity:0.7;}
.footer-contact i{font-size:16px;}

footer nav{margin-top:12px; display:flex; justify-content:center; gap:20px; flex-wrap:wrap;}
footer nav a{text-decoration:none; color:inherit; font-size:12px; transition:0.2s;}
footer nav a:hover{color:var(--fg-dark);}
@media(prefers-color-scheme: light){ footer nav a:hover{color:var(--fg-light);} }

/* Layout responsive per desktop */
@media(min-width:768px){
  .links{flex-direction:row; flex-wrap:wrap; justify-content:center;}
  .link{flex:1 1 150px; margin:8px;}
}
</style>
</head>

<body>
<header>
  <h2>YAHWZ.IT</h2>
</header>

<main class="hero">
  <h1>Digitalizziamo la tua impresa</h1>
  <p>Trasformiamo la tua attività con soluzioni digitali su misura: siti web, app, marketing, branding e consulenza UX/UI. Minimal. Terminale. Essenziale.</p>
  <div class="links">
    <a class="link" href="yahwzservice.html" target="_blank">service</a>
   
   
  </div>
</main>

<footer>
  <instagram<span id="yhazmadeit
  .instagram.com"</div>
  <div class="footer-contact">
    <a href="mailto:info@yahz.it"><i class="fas fa-envelope"></i> info@yahwz.it</a>
    <a href="https://www.instagram.com/yhazmadeit" target="_blank"><i class="fab fa-instagram"></i></a>
  </div>
  <nav>
    <a href="yhazmadeit.it" target="_blank">Yhazmadeit</a>
    <a >Yahwz</a>
  </nav>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
